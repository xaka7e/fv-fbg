name: Expand FBG V4.3.22

on:
  push:
    paths:
      - ".expand-trigger"

permissions:
  contents: write

jobs:
  expand:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Restore V4.3.22 from packed source
        run: npm run build

      - name: Promote restored site to repository root
        shell: bash
        run: |
          cp vercel.json /tmp/vercel.json
          cp robots.txt /tmp/robots.txt
          cp -a dist/. .
          cp /tmp/vercel.json vercel.json
          cp /tmp/robots.txt robots.txt
          rm -rf dist pack build.js package.json
          cat > README.md <<'EOF'
          # FBG Bau — рабочая версия

          Текущая версия: **V4.3.22**

          Статус: **рабочая версия**.

          Индексация тестового сайта отключена:
          - `robots.txt`: `Disallow: /`
          - Vercel header: `X-Robots-Tag: noindex, nofollow, noarchive, nosnippet`

          Исходники сайта находятся прямо в корне репозитория.
          EOF

      - name: Commit expanded working version
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "Expand FBG V4.3.22 working version"
            git push
          fi
